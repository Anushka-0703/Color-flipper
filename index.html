<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Color Flipper</title>
        <link rel="stylesheet" href="clrflipper.css" />
    </head>
    <body>
        <!-- Navbar -->
        <nav>
            <h1>🎨 Color Flipper</h1>
            <div class="nav-buttons">
                <button id="hex-btn">Hex</button>
                <button id="rgb-btn">RGB</button>
            </div>
        </nav>

        <!-- Main -->
        <main>
            <div class="container">
                <div id="color">
                    Background Color: <span class="colorName">#ffffff</span>
                </div>
                <button id="btn">Flip Color</button>
            </div>
        </main>

        <script src="clrflipper.js"></script>
    </body>
</html>
